<div class="login-page">
  <app-button class="back-btn btn-secondary" type="button" (click)="goBack()" aria-label="Retour au précédent">
    <i class="fas fa-arrow-left" aria-hidden="true"></i>
  </app-button>

  <div class="login-box">
    <div class="login-logo">
      <a href="#"><b>Football</b> Team</a>
    </div>
    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Connectez-vous pour démarrer votre session</p>

        <form [formGroup]="loginForm" (ngSubmit)="login()">

          <div class="input-group mb-3">
            <input type="text" formControlName="username" class="form-control" placeholder="Utilisateur"
              [class.is-invalid]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" />
            <div class="input-group-append"><div class="input-group-text">👤</div></div>
            <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="invalid-feedback">Le nom d'utilisateur est requis</div>
          </div>

          <div class="input-group mb-3">
            <input type="password" formControlName="password" class="form-control" placeholder="Mot de passe"
              [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" />
            <div class="input-group-append"><div class="input-group-text">🔒</div></div>
            <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']" class="invalid-feedback">Le mot de passe est requis</div>
            <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['minlength']" class="invalid-feedback">Le mot de passe doit contenir au moins 8 caractères</div>
          </div>

          <div class="row align-items-center">
            <div class="col-8">
              <label class="remember"><input type="checkbox" formControlName="remember" /> Se souvenir</label>
            </div>
            <div class="col-4">
              <app-button type="submit" [loading]="isSubmitting" [disabled]="loginForm.invalid || isSubmitting" [variant]="'primary'" class="w-100">Se connecter</app-button>
            </div>
          </div>
        </form>

        <div *ngIf="isSubmitting" class="mt-2 text-center"><app-loader></app-loader></div>

        <p class="mt-3 text-muted demo">Démo: admin / Admin#2025! (note: mot de passe demo ne respecte pas minlength)</p>
      </div>
    </div>
  </div>
</div>
