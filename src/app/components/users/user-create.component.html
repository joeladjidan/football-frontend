<div class="container">
  <h2>Créer un utilisateur</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-2">
      <label>Username</label>
      <input class="form-control" formControlName="username" />
      <div *ngIf="form.get('username')?.touched && form.get('username')?.invalid" class="text-danger small">Le nom d'utilisateur est requis</div>
    </div>
    <div class="mb-2">
      <label>Roles (comma separated)</label>
      <input class="form-control" formControlName="roles" />
    </div>
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Créer</button>
  </form>
</div>
