<!-- html -->
<div class="toast-container" *ngIf="messages.length">
    <div *ngFor="let m of messages" class="toast" [ngClass]="m.type">
        <div class="toast-text">{{ m.text }}</div>
        <div class="toast-actions">
            <button *ngIf="m.action && m.actionLabel" (click)="action(m)">{{ m.actionLabel }}</button>
            <button class="close" (click)="remove(m.id)">✕</button>
        </div>
    </div>
</div>
