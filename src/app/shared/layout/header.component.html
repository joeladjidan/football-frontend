<nav class="main-header navbar navbar-expand navbar-white navbar-light" [ngClass]="{'minimal-header': minimal}">
  <ul class="navbar-nav">
    <li class="nav-item" *ngIf="!minimal">
      <a class="nav-link" href="#" role="button" (click)="toggleSidebar($event)"><i class="fas fa-bars"></i></a>
    </li>
  </ul>

  <ul class="navbar-nav ml-auto">
    <li class="nav-item" style="margin-right:0.5rem;" *ngIf="!minimal">
      <app-button type="button" variant="secondary" (click)="toggleTheme()">
        <span class="theme-icon">{{ themeIcon }}</span>
        <span class="theme-label">{{ themeLabel }}</span>
      </app-button>
    </li>
    <li class="nav-item">
      <app-button *ngIf="auth.isLoggedIn() && !minimal" (click)="logout()">Se déconnecter</app-button>
      <a *ngIf="!auth.isLoggedIn() && !minimal" routerLink="/login" class="nav-link">Se connecter</a>
    </li>
  </ul>
</nav>
