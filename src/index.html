<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Football Teams</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CSS: Bootstrap & AdminLTE via CDN fallback (styles included via angular.json when node_modules present) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" integrity="" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css" integrity="" crossorigin="anonymous">
  <!-- FontAwesome moved to local import in styles.css -->
</head>
<body>
  <app-root>Chargement...</app-root>

  <!-- JS fallbacks via CDN (jQuery -> Bootstrap -> AdminLTE) -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js" crossorigin="anonymous"></script>

  <script>
    // Tiny runtime check to warn if AdminLTE did not load
    window.addEventListener('load', function() {
      if (!window.jQuery) {
        console.warn('jQuery non chargé — certaines fonctionnalités UI peuvent ne pas fonctionner');
      }
      if (typeof $.fn.modal === 'undefined') {
        console.warn('Bootstrap JS non chargé correctement');
      }
      if (typeof window.adminlte === 'undefined' && typeof $.AdminLTE === 'undefined') {
        console.info('AdminLTE non détecté — le fallback CDN est chargé si disponible');
      }
    });
  </script>
</body>
</html>
